name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Run tests
        run: python -m pytest -q
      - name: Scan the samples (should find hidden text, exit code 1)
        shell: bash
        run: |
          set +e
          htf samples/ --quiet --no-color
          test $? -eq 1
